<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Grupo Suprabond Uruguay</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --yellow: #FFD400;
            --blue: #29ABE2;
            --black: #111315;
            --white: #FFFFFF;
            --neutral-900: #111315;
            --neutral-800: #2D3138;
            --neutral-600: #5A626B;
            --neutral-300: #C9CDD2;
            --neutral-100: #ECEDEF;
            --neutral-50: #F4F5F6;
        }

        body {
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--neutral-50);
            color: var(--neutral-900);
        }

        /* Portada */
        .portada {
            background-color: var(--neutral-800);
            color: var(--white);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 4px solid var(--yellow);
        }

        .portada h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .logos-portada {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            align-items: center;
        }

        .logo-item {
            width: 120px;
            height: 120px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-item img {
            max-width: 100%;
            max-height: 100%;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            background-color: var(--white);
            border-bottom: 1px solid var(--neutral-100);
            padding: 12px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            max-width: 1340px;
            margin: 0 auto;
            z-index: 100;
            flex-wrap: wrap;
        }

        .navbar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categoria-dropdown {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .categoria-button {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--neutral-100);
            border-radius: 6px;
            background-color: var(--white);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .categoria-dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--white);
            min-width: 300px;
            border: 1px solid var(--neutral-100);
            border-radius: 6px;
            padding: 10px;
            top: 100%;
            left: 0;
            z-index: 101;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .categoria-dropdown:hover .categoria-dropdown-content {
            display: block;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input {
            cursor: pointer;
        }

        /* Buscador */
        .buscador {
            flex: 1;
            min-width: 200px;
            display: flex;
            border: 1px solid var(--neutral-100);
            border-radius: 6px;
            padding: 0;
            overflow: hidden;
        }

        .buscador input {
            flex: 1;
            border: none;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
        }

        .buscador-icon {
            padding: 10px 12px;
            color: var(--neutral-600);
            display: flex;
            align-items: center;
        }

        /* Botones */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-secondary {
            background-color: var(--white);
            border: 1px solid var(--neutral-100);
            color: var(--neutral-900);
        }

        .btn-secondary:hover {
            background-color: var(--neutral-50);
        }

        /* Contenedor principal */
        .container {
            max-width: 1340px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Grid de productos */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        @media (max-width: 1200px) {
            .productos-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .productos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .productos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Card de producto */
        .producto-card {
            background-color: var(--white);
            border: 1px solid var(--neutral-100);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .producto-card:hover {
            border-color: var(--blue);
            box-shadow: 0 4px 12px rgba(41, 171, 226, 0.15);
        }

        .producto-imagen {
            width: 100%;
            height: 200px;
            background-color: var(--neutral-100);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .producto-imagen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .producto-imagen.sin-imagen {
            color: var(--neutral-600);
            font-size: 12px;
        }

        .producto-info {
            padding: 12px;
        }

        .producto-sku {
            font-size: 11px;
            color: var(--neutral-600);
            margin-bottom: 4px;
        }

        .producto-nombre {
            font-size: 13px;
            font-weight: 500;
            color: var(--neutral-900);
            margin-bottom: 6px;
            line-height: 1.3;
            min-height: 26px;
        }

        .producto-marca {
            font-size: 11px;
            color: var(--blue);
            margin-bottom: 4px;
        }

        .producto-matcheo {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 4px;
        }

        .matcheo-exacto {
            background-color: #E8F5E9;
            color: #2E7D32;
        }

        .matcheo-sin_barra {
            background-color: #FFF3E0;
            color: #E65100;
        }

        .matcheo-sin_letra {
            background-color: #E3F2FD;
            color: #1565C0;
        }

        .matcheo-no {
            background-color: #FFEBEE;
            color: #C62828;
        }

        /* Tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 40px;
            font-size: 13px;
        }

        th {
            background-color: var(--neutral-800);
            color: var(--white);
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--neutral-100);
        }

        tr:hover {
            background-color: var(--neutral-50);
        }

        .no-resultados {
            text-align: center;
            padding: 40px;
            color: var(--neutral-600);
        }

        /* Contador */
        .contador {
            color: var(--neutral-600);
            font-size: 13px;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <!-- Portada -->
    <div class="portada">
        <h1>Catálogo Grupo Suprabond Uruguay</h1>
        <div class="logos-portada">
            <div class="logo-item">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAACXBIWXMAAA7DAAAOwwHHb6thAAABI0lEQVR4nO3YQQrCQBCG4ZnyHjy4V0/iRbz4gD6CD+ADeAkv4M16ce8l9CJ6gBbxVJgFZZOEJhLJYP/PBwvZZWZ+d2Z2dyGEEEIIIYQQQgjxT0nSUlJH0rqkD0nrkj4krSXpzWddWMgAAEACAEZSbXaW1Jb0Kb+fJL0l6SOvjZTzV7ztS4qZ4bVEzADAQAIBBhIIIIHgr0rSIu+5NV46MZACQM3yGP8V0xIAACABACMpNDvJakvSe16bLO/WljQzl7T1Ow7yJcqZLf7vHgKVpNWkraRPoRr3xvYt8xhJy7zmqrZuE9OStp+P1tKiTnlM6bwOIYQQQgghhBBCCCHEv/QFVGT9aXxQJNAAAAAASUVORK5CYII=" alt="Logo BLT">
            </div>
            <div class="logo-item">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAACXBIWXMAAA7DAAAOwwHHb6thAAABB0lEQVR4nO3aMQrCQBCG4ZnyCjm4V0/iRbz4gD6CD+ADeAkv4M16ce8l9CJ6gBbxVJgFZZOEJhLJYP/PBwvZZWZ+d2Z2dyGEEEIIIYQQQgjxT0nSUlJH0rqkD0nrkj4krSXpzWddWMgAAEACAEZSbXaW1Jb0Kb+fJL0l6SOvjZTzV7ztS4qZ4bVEzADAQAIBBhIIIIHgr0rSIu+5NV46MZACQM3yGP8V0xIAACABACMpNDvJakvSe16bLO/WljQzl7T1Ow7yJcqZLf7vHgKVpNWkraRPoRr3xvYt8xhJy7zmqrZuE9OStp+P1tKiTnlM6bwOIYQQQgghhBBCCCHEv/QFVGT9aXxQJNAAAAAASUVORK5CYII=" alt="Logo Suprabond">
            </div>
            <div class="logo-item">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAACXBIWXMAAA7DAAAOwwHHb6thAAABI0lEQVR4nO3YQQrCQBCG4ZnyHjy4V0/iRbz4gD6CD+ADeAkv4M16ce8l9CJ6gBbxVJgFZZOEJhLJYP/PBwvZZWZ+d2Z2dyGEEEIIIYQQQgjxT0nSUlJH0rqkD0nrkj4krSXpzWddWMgAAEACAEZSbXaW1Jb0Kb+fJL0l6SOvjZTzV7ztS4qZ4bVEzADAQAIBBhIIIIHgr0rSIu+5NV46MZACQM3yGP8V0xIAACABACMpNDvJakvSe16bLO/WljQzl7T1Ow7yJcqZLf7vHgKVpNWkraRPoRr3xvYt8xhJy7zmqrZuE9OStp+P1tKiTnlM6bwOIYQQQgghhBBCCCHEv/QFVGT9aXxQJNAAAAAASUVORK5CYII=" alt="Logo SMS">
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-item categoria-dropdown">
            <button class="categoria-button" onclick="toggleCategorias()">
                ☰ Categorías
                <span>▼</span>
            </button>
            <div class="categoria-dropdown-content" id="categoriasMenu">
                <!-- Se llena con JavaScript -->
            </div>
        </div>

        <div class="navbar-item buscador">
            <input type="text" id="buscador" placeholder="Buscar por nombre o SKU..." onkeyup="filtrarProductos()">
            <div class="buscador-icon">🔍</div>
        </div>

        <button class="btn btn-secondary" onclick="descargarPDF()">⬇️ PDF</button>
        <button class="btn btn-secondary" onclick="descargarCSV()">⬇️ CSV</button>
        <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <!-- Contenedor principal -->
    <div class="container">
        <div class="contador" id="contador"></div>
        <div id="productosContainer" class="productos-grid"></div>
        <table id="tablaProd"></table>
    </div>

    <script>
        // URL base para imágenes
        const URL_IMAGENES = 'https://raw.githubusercontent.com/aperez-suprabond/catalogo-erpa-uruguay/refs/heads/main/imagenes/';
        
        let productosOriginal = [];
        let productosFiltrados = [];
        let categoriasSeleccionadas = [];

        // Cargar datos
        fetch('datos_catalogo.json')
            .then(r => r.json())
            .then(data => {
                productosOriginal = data;
                productosFiltrados = [...productosOriginal];
                inicializarCategorias();
                renderizar();
            })
            .catch(e => console.error('Error cargando JSON:', e));

        function inicializarCategorias() {
            const cats = [...new Set(productosOriginal.map(p => p.categoria))].sort();
            const menu = document.getElementById('categoriasMenu');
            menu.innerHTML = cats.map(cat => `
                <label class="checkbox-item">
                    <input type="checkbox" value="${cat}" onchange="actualizarFiltros()">
                    <span>${cat}</span>
                </label>
            `).join('');
        }

        function toggleCategorias() {
            const menu = document.getElementById('categoriasMenu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        function actualizarFiltros() {
            const checkboxes = document.querySelectorAll('.categoria-dropdown-content input:checked');
            categoriasSeleccionadas = Array.from(checkboxes).map(cb => cb.value);
            filtrarProductos();
        }

        function filtrarProductos() {
            const busqueda = document.getElementById('buscador').value.toLowerCase();
            
            productosFiltrados = productosOriginal.filter(p => {
                const matchBusqueda = !busqueda || 
                    p.nombre.toLowerCase().includes(busqueda) ||
                    p.id.toLowerCase().includes(busqueda);
                
                const matchCategoria = categoriasSeleccionadas.length === 0 || 
                    categoriasSeleccionadas.includes(p.categoria);
                
                return matchBusqueda && matchCategoria;
            });
            
            renderizar();
        }

        function obtenerURLImagen(nombreArchivo) {
            if (!nombreArchivo) return null;
            
            // Si ya tiene extensión, usa tal cual
            if (nombreArchivo.includes('.')) {
                return URL_IMAGENES + nombreArchivo;
            }
            
            // Si no, intenta con .jpg (extensión más común)
            return URL_IMAGENES + nombreArchivo + '.jpg';
        }

        function renderizar() {
            document.getElementById('contador').textContent = 
                `${productosFiltrados.length} de ${productosOriginal.length} productos`;
            
            if (productosFiltrados.length === 0) {
                document.getElementById('productosContainer').innerHTML = 
                    '<div class="no-resultados">No hay productos que coincidan con tu búsqueda</div>';
                document.getElementById('tablaProd').innerHTML = '';
                return;
            }

            // Grid de tarjetas
            document.getElementById('productosContainer').innerHTML = productosFiltrados.map(p => `
                <div class="producto-card">
                    <div class="producto-imagen ${p.imagen ? '' : 'sin-imagen'}">
                        ${p.imagen ? `<img src="${obtenerURLImagen(p.imagen)}" alt="${p.nombre}" onerror="this.style.display='none'">` : 'Sin imagen'}
                    </div>
                    <div class="producto-info">
                        <div class="producto-sku">${p.id}</div>
                        <div class="producto-nombre">${p.nombre}</div>
                        ${p.marca ? `<div class="producto-marca">${p.marca}</div>` : ''}
                        <div class="producto-matcheo matcheo-${p.matcheo.toLowerCase().replace(' ', '_')}">
                            ${p.matcheo}
                        </div>
                    </div>
                </div>
            `).join('');

            // Tabla
            document.getElementById('tablaProd').innerHTML = `
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Producto</th>
                        <th>Marca</th>
                        <th>Categoría</th>
                        <th>Matcheo</th>
                    </tr>
                </thead>
                <tbody>
                    ${productosFiltrados.map(p => `
                        <tr>
                            <td>${p.id}</td>
                            <td>${p.nombre}</td>
                            <td>${p.marca || '-'}</td>
                            <td>${p.categoria}</td>
                            <td><span class="producto-matcheo matcheo-${p.matcheo.toLowerCase().replace(' ', '_')}">${p.matcheo}</span></td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
        }

        function descargarPDF() {
            alert('Descargando PDF...');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('Catálogo Grupo Suprabond Uruguay', 10, 10);
            doc.autoTable({
                head: [['SKU', 'Producto', 'Marca', 'Categoría']],
                body: productosFiltrados.map(p => [p.id, p.nombre, p.marca || '-', p.categoria])
            });
            doc.save('catalogo-grupo-suprabond-uruguay.pdf');
        }

        function descargarCSV() {
            const csv = [
                ['SKU', 'Producto', 'Marca', 'Categoría', 'Descripción', 'Matcheo'].join(','),
                ...productosFiltrados.map(p => [
                    `"${p.id}"`,
                    `"${p.nombre}"`,
                    `"${p.marca || ''}"`,
                    `"${p.categoria}"`,
                    `"${p.descripcion || ''}"`,
                    `"${p.matcheo}"`
                ].join(','))
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'catalogo-grupo-suprabond-uruguay.csv';
            link.click();
        }
    </script>
</body>
</html>
