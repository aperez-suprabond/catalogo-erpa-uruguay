<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Grupo Suprabond Uruguay</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --yellow: #FFD400;
            --blue: #29ABE2;
            --black: #111315;
            --white: #FFFFFF;
            --neutral-900: #111315;
            --neutral-800: #2D3138;
            --neutral-600: #5A626B;
            --neutral-300: #C9CDD2;
            --neutral-100: #ECEDEF;
            --neutral-50: #F4F5F6;
        }

        body {
            background-color: var(--neutral-50);
            color: var(--neutral-900);
        }

        .portada {
            background-color: var(--neutral-800);
            color: var(--white);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 4px solid var(--yellow);
        }

        .portada h1 {
            font-size: 2.5em;
            margin-bottom: 40px;
            font-weight: 700;
        }

        .logos-portada {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            align-items: center;
        }

        .logo-item {
            width: 120px;
            height: 120px;
            background-color: var(--white);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-item img {
            max-width: 100%;
            max-height: 100%;
        }

        .navbar {
            position: sticky;
            top: 0;
            background-color: var(--white);
            border-bottom: 1px solid var(--neutral-100);
            padding: 12px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            max-width: 1340px;
            margin: 0 auto;
            z-index: 100;
            flex-wrap: wrap;
        }

        .navbar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown {
            position: relative;
            flex: 1;
            min-width: 150px;
        }

        .dropdown-button {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--neutral-100);
            border-radius: 6px;
            background-color: var(--white);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--white);
            min-width: 250px;
            border: 1px solid var(--neutral-100);
            border-radius: 6px;
            padding: 10px;
            top: 100%;
            left: 0;
            z-index: 101;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input {
            cursor: pointer;
        }

        .buscador {
            flex: 1;
            min-width: 200px;
            display: flex;
            border: 1px solid var(--neutral-100);
            border-radius: 6px;
            padding: 0;
            overflow: hidden;
        }

        .buscador input {
            flex: 1;
            border: none;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .buscador-icon {
            padding: 10px 12px;
            color: var(--neutral-600);
            display: flex;
            align-items: center;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .btn-secondary {
            background-color: var(--white);
            border: 1px solid var(--neutral-100);
            color: var(--neutral-900);
        }

        .btn-secondary:hover {
            background-color: var(--neutral-50);
        }

        .container {
            max-width: 1340px;
            margin: 0 auto;
            padding: 20px;
        }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        @media (max-width: 1200px) {
            .productos-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .productos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .productos-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .producto-card {
            background-color: var(--white);
            border: 1px solid var(--neutral-100);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .producto-card:hover {
            border-color: var(--blue);
            box-shadow: 0 4px 12px rgba(41, 171, 226, 0.15);
        }

        .producto-imagen {
            width: 100%;
            height: 200px;
            background-color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--neutral-100);
        }

        .producto-imagen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .producto-imagen.sin-imagen {
            color: var(--neutral-600);
            font-size: 12px;
        }

        .producto-info {
            padding: 12px;
        }

        .producto-sku {
            font-size: 11px;
            color: var(--neutral-600);
            margin-bottom: 4px;
        }

        .producto-nombre {
            font-size: 13px;
            font-weight: 700;
            color: var(--neutral-900);
            margin-bottom: 6px;
            line-height: 1.3;
            min-height: 26px;
            text-transform: capitalize;
        }

        .producto-nombre-tabla {
            text-transform: capitalize;
            font-weight: 600;
        }

        .producto-marca {
            font-size: 12px;
            color: var(--blue);
            font-weight: 500;
            margin-top: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 40px;
            font-size: 13px;
        }

        th {
            background-color: var(--neutral-800);
            color: var(--white);
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--neutral-100);
        }

        tr:hover {
            background-color: var(--neutral-50);
        }

        .no-resultados {
            text-align: center;
            padding: 40px;
            color: var(--neutral-600);
        }

        .contador {
            color: var(--neutral-600);
            font-size: 13px;
            padding: 10px 0;
        }
    </style>
</head>

        function inicializar() {
            productosOriginal = productosData;
            productosFiltrados = [...productosOriginal];
            inicializarCategorias();
            inicializarMarcas();
            renderizar();
            console.log('✅ Catálogo cargado: ' + productosOriginal.length + ' productos');
        }

        function inicializarCategorias() {
            const cats = [...new Set(productosOriginal.map(p => p.categoria))].sort();
            const menu = document.getElementById('categoriasMenu');
            menu.innerHTML = cats.map(cat => `
                <label class="checkbox-item">
                    <input type="checkbox" value="${cat}" onchange="actualizarFiltros()">
                    <span>${cat}</span>
                </label>
            `).join('');
        }

        function inicializarMarcas() {
            const marcas = [...new Set(productosOriginal.map(p => p.marca).filter(m => m))].sort();
            const menu = document.getElementById('marcasMenu');
            menu.innerHTML = marcas.map(marca => `
                <label class="checkbox-item">
                    <input type="checkbox" value="${marca}" onchange="actualizarFiltros()">
                    <span>${marca}</span>
                </label>
            `).join('');
        }

        function toggleDropdown(dropdownId) {
            const menu = document.getElementById(dropdownId);
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        function actualizarFiltros() {
            const checkboxesCategorias = document.querySelectorAll('#categoriasMenu input:checked');
            categoriasSeleccionadas = Array.from(checkboxesCategorias).map(cb => cb.value);
            
            const checkboxesMarcas = document.querySelectorAll('#marcasMenu input:checked');
            marcasSeleccionadas = Array.from(checkboxesMarcas).map(cb => cb.value);
            
            filtrarProductos();
        }

        function filtrarProductos() {
            const busqueda = document.getElementById('buscador').value.toLowerCase();
            
            productosFiltrados = productosOriginal.filter(p => {
                const matchBusqueda = !busqueda || 
                    p.nombre.toLowerCase().includes(busqueda) ||
                    p.id.toLowerCase().includes(busqueda);
                
                const matchCategoria = categoriasSeleccionadas.length === 0 || 
                    categoriasSeleccionadas.includes(p.categoria);
                
                const matchMarca = marcasSeleccionadas.length === 0 || 
                    marcasSeleccionadas.includes(p.marca);
                
                return matchBusqueda && matchCategoria && matchMarca;
            });
            
            renderizar();
        }

        function obtenerURLImagen(nombreArchivo) {
            if (!nombreArchivo) return null;
            const partes = nombreArchivo.split('/');
            const nombreCodificado = partes.map(p => encodeURIComponent(p)).join('/');
            return URL_IMAGENES + nombreCodificado;
        }

        function renderizar() {
            document.getElementById('contador').textContent = 
                `${productosFiltrados.length} de ${productosOriginal.length} productos`;
            
            if (productosFiltrados.length === 0) {
                document.getElementById('productosContainer').innerHTML = 
                    '<div class="no-resultados">No hay productos que coincidan con tu búsqueda</div>';
                document.getElementById('tablaProd').innerHTML = '';
                return;
            }

            document.getElementById('productosContainer').innerHTML = productosFiltrados.map(p => `
                <div class="producto-card">
                    <div class="producto-imagen ${p.imagen ? '' : 'sin-imagen'}">
                        ${p.imagen ? `<img src="${obtenerURLImagen(p.imagen)}" alt="${p.nombre}" onerror="this.style.display='none'">` : 'Sin imagen'}
                    </div>
                    <div class="producto-info">
                        <div class="producto-sku">${p.id}</div>
                        <div class="producto-nombre">${p.nombre}</div>
                        ${p.marca ? `<div class="producto-marca">${p.marca}</div>` : ''}
                    </div>
                </div>
            `).join('');

            document.getElementById('tablaProd').innerHTML = `
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Producto</th>
                        <th>Marca</th>
                        <th>Categoría</th>
                    </tr>
                </thead>
                <tbody>
                    ${productosFiltrados.map(p => `
                        <tr>
                            <td>${p.id}</td>
                            <td class="producto-nombre-tabla">${p.nombre}</td>
                            <td>${p.marca || '-'}</td>
                            <td>${p.categoria}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
        }

        function descargarPDF() {
            alert('Descargando PDF...');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text('Catálogo Grupo Suprabond Uruguay', 10, 10);
            doc.autoTable({
                head: [['SKU', 'Producto', 'Marca', 'Categoría']],
                body: productosFiltrados.map(p => [p.id, p.nombre, p.marca || '-', p.categoria])
            });
            doc.save('catalogo-grupo-suprabond-uruguay.pdf');
        }

        function descargarCSV() {
            const csv = [
                ['SKU', 'Producto', 'Marca', 'Categoría'].join(','),
                ...productosFiltrados.map(p => [
                    `"${p.id}"`,
                    `"${p.nombre}"`,
                    `"${p.marca || ''}"`,
                    `"${p.categoria}"`
                ].join(','))
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'catalogo-grupo-suprabond-uruguay.csv';
            link.click();
        }

        window.addEventListener('load', inicializar);
    </script>
