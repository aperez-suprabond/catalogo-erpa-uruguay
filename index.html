<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo ERPA Uruguay</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --color-yellow: #FFD400;
            --color-blue: #29ABE2;
            --color-black: #111315;
            --color-white: #FFFFFF;
            --neutral-900: #111315;
            --neutral-800: #2D3138;
            --neutral-600: #5A626B;
            --neutral-300: #C9CDD2;
            --neutral-100: #ECEDEF;
            --neutral-50: #F4F5F6;
            --font-main: "Google Sans", sans-serif;
        }

        html { 
            font-family: var(--font-main); 
            font-size: 14px; 
            line-height: 1.5; 
            color: var(--neutral-900); 
            background: var(--neutral-50); 
        }
        body { margin: 0; padding: 0; }
        
        h1 { font-family: var(--font-main); font-size: 32px; font-weight: 700; margin-bottom: 12px; }
        h2 { font-family: var(--font-main); font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--neutral-900); }
        
        .container { max-width: 1340px; margin: 0 auto; padding: 0 14px; }
        
        /* PORTADA */
        .cover {
            background: var(--neutral-800);
            color: var(--color-white);
            padding: 30px 14px;
            text-align: center;
            page-break-after: always;
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .cover h1 { 
            color: var(--color-white); 
            font-size: 32px; 
            margin-bottom: 14px;
            font-weight: 700;
        }
        
        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        
        .logo { 
            background: var(--color-white); 
            padding: 8px; 
            border-radius: 10px; 
            box-shadow: 0 4px 12px rgba(0,0,0,.15); 
            max-width: 100px; 
        }
        .logo img { width: 100%; height: auto; display: block; }
        
        .cover-version { 
            font-size: 10px; 
            color: rgba(255,255,255,.6); 
            margin-top: 10px; 
        }
        
        /* NAVBAR */
        .navbar {
            background: var(--color-white);
            border-bottom: 2px solid var(--color-yellow);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        
        .navbar-content {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
        }
        
        /* DROPDOWN CATEGORÍAS */
        .dropdown-wrapper {
            position: relative;
        }
        
        .menu-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: transparent;
            color: var(--color-black);
            border: 2px solid var(--color-black);
            border-radius: 8px;
            font-family: var(--font-main);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all .2s;
            white-space: nowrap;
        }
        
        .menu-btn:hover {
            background: var(--color-yellow);
            border-color: var(--color-yellow);
        }
        
        .menu-icon {
            font-size: 18px;
        }
        
        .dropdown-content {
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--color-white);
            border: 1px solid var(--neutral-300);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            margin-top: 6px;
            padding: 8px;
            min-width: 220px;
            display: none;
            z-index: 1001;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .dropdown-content.show {
            display: block;
        }
        
        .category-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 8px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: background .2s;
        }
        
        .category-option:hover {
            background: var(--neutral-50);
        }
        
        .category-option input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: var(--color-yellow);
            margin: 0;
        }
        
        .category-option label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }
        
        /* SEARCH BOX */
        .search-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 200px;
            gap: 8px;
            padding: 8px 12px;
            background: var(--neutral-50);
            border: 1px solid var(--neutral-300);
            border-radius: 8px;
        }
        
        .search-icon {
            font-size: 16px;
            color: var(--neutral-600);
        }
        
        .search-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: var(--font-main);
            font-size: 13px;
            outline: none;
        }
        
        .search-wrapper input::placeholder {
            color: var(--neutral-600);
        }
        
        /* BOTONES ACCIÓN */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        
        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 2px solid var(--color-black);
            border-radius: 8px;
            background: transparent;
            color: var(--color-black);
            font-size: 18px;
            cursor: pointer;
            transition: all .2s;
        }
        
        .icon-btn:hover {
            background: var(--color-yellow);
            border-color: var(--color-yellow);
        }
        
        /* CONTENIDO */
        .section { page-break-before: always; margin-top: 0; margin-bottom: 0; }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            margin-top: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--neutral-100);
            cursor: pointer;
            user-select: none;
        }
        
        .section-header:hover {
            opacity: 0.8;
        }
        
        .collapse-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: transform 0.3s;
            color: var(--neutral-600);
        }
        
        .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }
        
        .section-title { 
            color: var(--neutral-900);
            font-weight: 700;
            font-size: 20px;
            margin: 0;
        }
        
        .product-count { 
            background: var(--color-yellow); 
            color: var(--color-black); 
            padding: 6px 12px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 12px; 
        }
        
        .section-content {
            overflow: hidden;
            max-height: 10000px;
            transition: max-height 0.3s ease;
        }
        
        .section-content.collapsed {
            max-height: 0;
            overflow: hidden;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        
        .product-card {
            background: var(--color-white);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            overflow: hidden;
            transition: all .3s;
            border: 1px solid transparent;
        }
        
        .product-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); border-color: var(--color-blue); }
        
        .product-image {
            width: 100%;
            height: 140px;
            background: var(--neutral-100);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .product-image img { width: 85%; height: 85%; object-fit: contain; }
        
        .product-image.no-image {
            background: linear-gradient(135deg, var(--neutral-100) 0%, var(--neutral-50) 100%);
            color: var(--neutral-600);
            font-size: 10px;
            text-align: center;
        }
        
        .product-info { padding: 10px; }
        
        .product-title {
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--neutral-900);
            line-height: 1.3;
            text-transform: capitalize;
            min-height: 30px;
        }
        
        .product-sku {
            background: var(--neutral-50);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 500;
            color: var(--color-blue);
            font-family: monospace;
            word-break: break-all;
        }
        
        /* TABLA */
        .table-section { 
            page-break-before: always; 
            margin-top: 20px; 
            margin-bottom: 20px; 
        }
        .table-section h2 { color: var(--neutral-900); margin-bottom: 16px; }
        
        .table-responsive { 
            overflow-x: auto; 
            border: 1px solid var(--neutral-100); 
            border-radius: 12px; 
            box-shadow: 0 1px 3px rgba(0,0,0,.06); 
        }
        
        table { width: 100%; border-collapse: collapse; background: var(--color-white); }
        thead { background: var(--color-yellow); color: var(--color-black); }
        th { padding: 12px; text-align: left; font-weight: 600; font-family: var(--font-main); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--neutral-100); font-size: 13px; }
        tbody tr:hover { background: var(--neutral-50); }
        
        .table-image { width: 50px; height: 50px; object-fit: contain; border-radius: 6px; background: var(--neutral-100); }
        .table-sku { font-family: monospace; font-size: 11px; color: var(--color-blue); font-weight: 600; }
        
        /* ACCIONES */
        .actions { 
            text-align: center; 
            padding: 16px; 
            background: var(--neutral-50); 
            border-top: 1px solid var(--neutral-100); 
        }
        
        .btn { 
            padding: 10px 16px; 
            margin: 0 10px; 
            border: 2px solid var(--color-black);
            border-radius: 8px; 
            font-family: var(--font-main); 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 13px;
            background: transparent;
            color: var(--color-black);
            transition: all .2s;
        }
        .btn:hover { 
            background: var(--color-yellow);
            border-color: var(--color-yellow);
        }
        
        .no-print { print: none; }
        
        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .products-grid { 
                grid-template-columns: repeat(4, 1fr); 
            }
        }

        @media (max-width: 768px) {
            .products-grid { 
                grid-template-columns: repeat(3, 1fr); 
            }
            .navbar-content {
                flex-wrap: wrap;
            }
            .search-wrapper {
                flex: 1;
                min-width: 100%;
            }
            .action-buttons {
                margin-left: 0;
                width: 100%;
                justify-content: flex-start;
            }
        }

        @media (max-width: 480px) {
            .products-grid { 
                grid-template-columns: repeat(2, 1fr); 
            }
            .icon-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }

        @media print {
            .no-print { display: none; }
            .navbar { display: none; }
        }
    </style>
</head>

        <div class="cover">

            <div class="logos-container" id="logos"></div>

                </div>
            </div>
        </div>

        <div class="container">

            <div class="table-section">

            </div>

                <button class="btn" onclick="descargarCSV()">📥 Descargar CSV</button>
                <button class="btn" onclick="window.print()">📄 Imprimir</button>

        </div>
    </div>

        let categoriasSeleccionadas = [];

        function crearImg(producto) {
            const img = document.createElement('img');
            img.src = producto.url_imagen;
            img.alt = producto['Nombre del producto'];
            img.loading = 'lazy';
            
            img.onerror = function() {
                if (this.src === producto.url_imagen) {
                    this.src = producto.url_imagen_fallback1;
                } else if (this.src === producto.url_imagen_fallback1) {
                    this.src = producto.url_imagen_fallback2;
                } else {
                    this.parentElement.innerHTML = '<div class=\'no-image\'><div>📷</div></div>';
                }
            };
            
            return img;
        }

        function inicializar() {
            cargarLogos();
            cargarDropdown();
            renderizarCatalogo();
            renderizarTabla();
        }

        function cargarLogos() {
            const logosContainer = document.getElementById('logos');
            const logos = [
                { nombre: 'BULIT', data: catalogoData.logos.BULIT },
                { nombre: 'Suprabond', data: catalogoData.logos.Suprabond },
                { nombre: 'Somerset', data: catalogoData.logos.Somerset }
            ];

            logos.forEach(logo => {
                const div = document.createElement('div');
                div.className = 'logo';
                div.innerHTML = `<img src="data:image/png;base64,${logo.data}" alt="${logo.nombre}">`;
                logosContainer.appendChild(div);
            });
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('dropdownContent');
            dropdown.classList.toggle('show');
        }

        function cargarDropdown() {
            const dropdownContent = document.getElementById('dropdownContent');
            dropdownContent.innerHTML = '';
            
            const categorias = [...new Set(catalogoData.productos.map(p => p.Categoria))].sort();
            
            categorias.forEach((cat, idx) => {
                const div = document.createElement('div');
                div.className = 'category-option';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'cat_' + idx;
                checkbox.value = cat;
                checkbox.onchange = () => actualizarFiltros();
                
                const label = document.createElement('label');
                label.htmlFor = 'cat_' + idx;
                label.textContent = cat;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                dropdownContent.appendChild(div);
            });
        }

        function actualizarFiltros() {
            const checkboxes = document.querySelectorAll('#dropdownContent input[type="checkbox"]');
            categoriasSeleccionadas = [];
            
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    categoriasSeleccionadas.push(checkbox.value);
                }
            });
            
            renderizarCatalogo();
            renderizarTabla();
        }

        function toggleSection(sectionId) {
            const content = document.getElementById('content-' + sectionId);
            const icon = document.getElementById('icon-' + sectionId);
            
            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }

        function renderizarCatalogo() {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            let categorias;
            if (categoriasSeleccionadas.length === 0) {
                categorias = [...new Set(catalogoData.productos.map(p => p.Categoria))].sort();
            } else {
                categorias = categoriasSeleccionadas;
            }

            categorias.forEach((categoria, idx) => {
                const productos = catalogoData.productos.filter(p => p.Categoria === categoria);
                
                const section = document.createElement('div');
                section.className = 'section';

                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'section-header';
                sectionHeader.onclick = () => toggleSection(idx);
                
                const icon = document.createElement('div');
                icon.className = 'collapse-icon';
                icon.id = 'icon-' + idx;
                icon.textContent = '›';
                
                const title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = categoria;
                
                const count = document.createElement('span');
                count.className = 'product-count';
                count.textContent = productos.length;
                
                sectionHeader.appendChild(icon);
                sectionHeader.appendChild(title);
                sectionHeader.appendChild(count);

                const sectionContent = document.createElement('div');
                sectionContent.className = 'section-content';
                sectionContent.id = 'content-' + idx;

                const grid = document.createElement('div');
                grid.className = 'products-grid';

                productos.forEach(producto => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    const imageDiv = document.createElement('div');
                    imageDiv.className = 'product-image';
                    
                    if (producto.url_imagen) {
                        imageDiv.appendChild(crearImg(producto));
                    } else {
                        imageDiv.innerHTML = '<div class=\'no-image\'><div>📷</div></div>';
                    }
                    
                    card.appendChild(imageDiv);

                    const info = document.createElement('div');
                    info.className = 'product-info';
                    info.innerHTML = `
                        <div class="product-title">${producto['Nombre del producto']}</div>
                        <div class="product-sku">${producto['Producto_id']}</div>
                    `;
                    card.appendChild(info);
                    grid.appendChild(card);
                });

                sectionContent.appendChild(grid);
                section.appendChild(sectionHeader);
                section.appendChild(sectionContent);
                catalogo.appendChild(section);
            });
        }

        function renderizarTabla() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            let productos;
            if (categoriasSeleccionadas.length === 0) {
                productos = catalogoData.productos;
            } else {
                productos = catalogoData.productos.filter(p => 
                    categoriasSeleccionadas.includes(p.Categoria)
                );
            }

            productos.forEach(producto => {
                const row = document.createElement('tr');
                
                const tdImg = document.createElement('td');
                if (producto.url_imagen) {
                    const img = crearImg(producto);
                    img.className = 'table-image';
                    tdImg.appendChild(img);
                } else {
                    tdImg.innerHTML = '<div style="width: 50px; height: 50px; background: var(--neutral-100); border-radius: 6px; display: flex; align-items: center; justify-content: center;">📷</div>';
                }

                row.appendChild(tdImg);
                row.innerHTML += `<td>${producto['Nombre del producto']}</td><td class="table-sku">${producto['Producto_id']}</td>`;
                tableBody.appendChild(row);
            });
        }

        function filtrarProductos() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();

            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            let categorias;
            if (categoriasSeleccionadas.length === 0) {
                categorias = [...new Set(catalogoData.productos.map(p => p.Categoria))].sort();
            } else {
                categorias = categoriasSeleccionadas;
            }

            let sectionIdx = 0;
            categorias.forEach(categoria => {
                let productos = catalogoData.productos.filter(p => p.Categoria === categoria);
                
                if (searchInput) {
                    productos = productos.filter(p => {
                        const titulo = p['Nombre del producto'].toLowerCase();
                        const sku = p['Producto_id'].toLowerCase();
                        return titulo.includes(searchInput) || sku.includes(searchInput);
                    });
                }

                if (productos.length === 0) return;
                
                const section = document.createElement('div');
                section.className = 'section';

                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'section-header';
                sectionHeader.onclick = () => toggleSection(sectionIdx);
                
                const icon = document.createElement('div');
                icon.className = 'collapse-icon';
                icon.id = 'icon-' + sectionIdx;
                icon.textContent = '›';
                
                const title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = categoria;
                
                const count = document.createElement('span');
                count.className = 'product-count';
                count.textContent = productos.length;
                
                sectionHeader.appendChild(icon);
                sectionHeader.appendChild(title);
                sectionHeader.appendChild(count);

                const sectionContent = document.createElement('div');
                sectionContent.className = 'section-content';
                sectionContent.id = 'content-' + sectionIdx;

                const grid = document.createElement('div');
                grid.className = 'products-grid';

                productos.forEach(producto => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    const imageDiv = document.createElement('div');
                    imageDiv.className = 'product-image';
                    
                    if (producto.url_imagen) {
                        imageDiv.appendChild(crearImg(producto));
                    } else {
                        imageDiv.innerHTML = '<div class=\'no-image\'><div>📷</div></div>';
                    }
                    
                    card.appendChild(imageDiv);

                    const info = document.createElement('div');
                    info.className = 'product-info';
                    info.innerHTML = `
                        <div class="product-title">${producto['Nombre del producto']}</div>
                        <div class="product-sku">${producto['Producto_id']}</div>
                    `;
                    card.appendChild(info);
                    grid.appendChild(card);
                });

                sectionContent.appendChild(grid);
                section.appendChild(sectionHeader);
                section.appendChild(sectionContent);
                catalogo.appendChild(section);
                
                sectionIdx++;
            });
        }

        async function descargarPDF() {
            const btn = event.target.closest('.icon-btn');
            btn.textContent = '⏳';
            btn.disabled = true;

            try {
                const catalogo = document.getElementById('catalogo');
                const canvas = await html2canvas(catalogo, { 
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#FFFFFF'
                });
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });
                
                const imgData = canvas.toDataURL('image/png');
                const pdfWidth = 210;
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                let heightLeft = pdfHeight;
                let position = 0;
                
                pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
                heightLeft -= 297;
                
                while (heightLeft >= 0) {
                    position = heightLeft - pdfHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
                    heightLeft -= 297;
                }
                
                pdf.save('catalogo-erpa-uruguay.pdf');
            } catch (error) {
                console.error('Error al generar PDF:', error);
                alert('Error al generar PDF');
            } finally {
                btn.textContent = '⬇️';
                btn.disabled = false;
            }
        }

        function descargarCSV() {
            let csv = 'Producto_id,Nombre del producto,Categoría\n';
            
            let productos;
            if (categoriasSeleccionadas.length === 0) {
                productos = catalogoData.productos;
            } else {
                productos = catalogoData.productos.filter(p => 
                    categoriasSeleccionadas.includes(p.Categoria)
                );
            }
                
            productos.forEach(producto => {
                const id = producto['Producto_id'].replace(/"/g, '""');
                const nombre = producto['Nombre del producto'].replace(/"/g, '""');
                const categoria = producto['Categoria'].replace(/"/g, '""');
                csv += `"${id}","${nombre}","${categoria}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', 'catalogo_uruguay.csv');
            link.click();
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('dropdownContent');
            const menuBtn = event.target.closest('.menu-btn');
            
            if (!menuBtn && !dropdown.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        window.addEventListener('load', inicializar);
    </script>
